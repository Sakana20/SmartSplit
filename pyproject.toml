[project]
name = "funasr-timeline"
version = "0.1.0"
description = "Generate manuscript-based sentence timelines from ASR token timestamps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "funasr>=1.3.10",
    "hanlp>=2.1.3",
    "httpx>=0.28.0",
    "jieba>=0.42.1",
    "jinja2>=3.1.0",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "qwen-asr>=0.0.6",
    "rich>=15.0.0",
    "socksio>=1.0.0",
    "soundfile>=0.14.0",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "transformers==4.57.6",
]

[project.scripts]
funasr-timeline = "funasr_timeline.cli:main"
smartsplit = "funasr_timeline.smartsplit_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["funasr_timeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e_real: real end-to-end tests that call Jianying TTS, LLM segmentation, Qwen3 forced aligner, and local Paraformer/FunASR",
]
